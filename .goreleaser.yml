# Visit https://goreleaser.com for documentation on how to customize this
# behavior.
version: 2

# Registry requires this exact project name in artifact names.
project_name: terraform-provider-h3

# No `go mod tidy` hook: the tagged tree is built as is (GOFLAGS=-mod=readonly), the same tag gives the same zips.

builds:
  - env:
      # goreleaser does not work with CGO, it could also determine
      # temporary build directory, necessary for the matrix of platforms
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# GPG signature of SHA256SUMS: required by the Terraform and OpenTofu registries. CI imports the release
# subkey from GPG_PRIVATE_KEY_FILE (CI variable of type File, protected), passphrase from GPG_PASSPHRASE.
signs:
  - artifacts: checksum
    stdin: "{{ .Env.GPG_PASSPHRASE }}"
    args:
      - "--batch"
      - "--pinentry-mode"
      - "loopback"
      - "--passphrase-fd"
      - "0"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}" # set this environment variable for your signing key
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

# Public channel: GitHub release of h3llo-cloud/terraform-provider-h3; the Terraform Registry picks it up by
# webhook. CI pushes the source snapshot and the tag to GitHub first (scripts/github-sync.sh).
release:
  github:
    owner: h3llo-cloud
    name: terraform-provider-h3
  prerelease: auto
  mode: replace
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

# Release notes come from CHANGELOG.md (goreleaser release --release-notes=...).
changelog:
  disable: true

